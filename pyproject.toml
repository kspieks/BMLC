[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "BMLC"
version = "0.1.0"
description = "Baseline Machine Learning for Cheminformatics: sklearn and XGBoost models on RDKit fingerprints, tuned with Optuna."
readme = "README.md"
authors = [{ name = "Kevin Spiekermann" }]
requires-python = ">=3.12"
dependencies = [
    "descriptastorus>=2.8",
    "joblib>=1.6",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "optuna>=5.0",
    "pandas>=3.1",
    "pyyaml>=6.0",
    "rdkit>=2026.9",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "seaborn>=0.13",
    "xgboost>=3.4",
]

[project.urls]
source = "https://github.com/kspieks/BMLC"

[dependency-groups]
# Extra packages needed only to run the notebooks
notebooks = [
    "astartes>=1.3",
    "hiplot>=0.1.33",
    "ipykernel>=7.4",
    "jupyterlab>=4.6",
]

[tool.setuptools.packages.find]
include = ["baseline_models*"]

[tool.uv]
# Use a uv-managed Python, not one from Anaconda or the system
python-preference = "only-managed"
default-groups = ["notebooks"]
